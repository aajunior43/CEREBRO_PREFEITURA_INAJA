<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Prefeitura de Inajá</title>
  <meta name="description" content="Sistema de Gestão Municipal – Prefeitura de Inajá. Acesse o painel de controle de empenhos e documentos." />
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
  <link rel="icon" type="image/png" href="/static/img/brasao.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --brand-glow: rgba(37, 99, 235, 0.35);
      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --input-bg: rgba(255,255,255,0.75);
      --input-border: rgba(0,0,0,0.14);
      --error: #dc2626;
    }

    [data-theme="dark"] {
      --glass-bg: rgba(15, 23, 42, 0.80);
      --glass-border: rgba(255, 255, 255, 0.10);
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --input-bg: rgba(30, 41, 59, 0.8);
      --input-border: rgba(255,255,255,0.12);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 100vh;
    }

    /* ── Animated gradient background ── */
    .login-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #0c1a3a 60%, #172554 100%);
      overflow: hidden;
    }

    .login-bg::before {
      content: '';
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(37, 99, 235, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(99, 102, 241, 0.22) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 60% 20%, rgba(14, 165, 233, 0.18) 0%, transparent 60%);
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.12) rotate(3deg); }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float linear infinite;
      opacity: 0;
    }
    .orb-1 { width: 350px; height: 350px; background: rgba(37,99,235,0.22); top: 5%; left: 10%; animation-duration: 18s; animation-delay: 0s; }
    .orb-2 { width: 280px; height: 280px; background: rgba(99,102,241,0.18); top: 55%; right: 8%; animation-duration: 22s; animation-delay: -6s; }
    .orb-3 { width: 200px; height: 200px; background: rgba(14,165,233,0.2); bottom: 12%; left: 35%; animation-duration: 16s; animation-delay: -10s; }

    @keyframes float {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-30px) scale(1.1); }
    }

    /* Grid overlay */
    .login-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── Login Card ── */
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 44px 40px 36px;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    /* Brand area */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      gap: 10px;
    }

    .login-brasao-wrap {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(99,102,241,0.12) 100%);
      border: 1px solid rgba(37,99,235,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 24px rgba(37,99,235,0.18),
        inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-brasao-wrap:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 0 14px 36px rgba(37,99,235,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .login-brasao {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    }

    .login-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      text-align: center;
      line-height: 1.2;
    }

    .login-subtitle {
      font-size: 12.5px;
      color: var(--text-2);
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--input-border);
    }

    .login-divider span {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-3);
    }

    /* Form fields */
    .login-field {
      margin-bottom: 16px;
    }

    .login-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
    }

    .login-label svg {
      width: 13px;
      height: 13px;
      opacity: 0.6;
    }

    .login-input-wrap {
      position: relative;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }

    .login-input::placeholder {
      color: var(--text-3);
    }

    .login-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3.5px var(--brand-glow);
      background: rgba(255,255,255,0.92);
    }

    [data-theme="dark"] .login-input:focus {
      background: rgba(30, 41, 59, 0.95);
    }

    .login-input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-3);
      pointer-events: none;
      transition: color 0.2s;
    }

    .login-field:focus-within .login-input-icon {
      color: var(--brand);
    }

    /* Toggle password */
    .login-eye-btn {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      padding: 4px;
      line-height: 0;
      transition: color 0.2s;
    }

    .login-eye-btn:hover { color: var(--text-2); }
    .login-eye-btn svg { width: 16px; height: 16px; }

    /* Submit button */
    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4), 0 1px 0 rgba(255,255,255,0.12) inset;
      letter-spacing: 0.3px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.5), 0 1px 0 rgba(255,255,255,0.15) inset;
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Spinner */
    .login-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .login-btn.loading .login-spinner { display: block; }
    .login-btn.loading .login-btn-text { opacity: 0.7; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error message */
    .login-error {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--error);
      animation: shakeIn 0.4s ease;
    }

    .login-error.show { display: flex; }

    .login-error svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    @keyframes shakeIn {
      0% { transform: translateX(0); }
      15% { transform: translateX(-6px); }
      35% { transform: translateX(6px); }
      55% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11.5px;
      color: var(--text-3);
    }

    /* Security badge */
    .login-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .login-security svg {
      width: 12px;
      height: 12px;
      color: rgba(255,255,255,0.5);
    }

    .login-security span {
      font-size: 10.5px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.3px;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px 28px; border-radius: 18px; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="login-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="login-bg-grid"></div>
  </div>

  <!-- Card -->
  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brasao-wrap">
          <img class="login-brasao" src="/static/img/brasao.png" alt="Brasão da Prefeitura de Inajá" />
        </div>
        <h1 class="login-title">Sistema de Empenhos</h1>
        <p class="login-subtitle">Prefeitura Municipal de Inajá</p>
      </div>

      <div class="login-divider"><span>Acesse sua conta</span></div>

      <form id="login-form" autocomplete="off" novalidate>

        <!-- Usuário -->
        <div class="login-field">
          <label class="login-label" for="login-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Usuário
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login-input" class="login-input" placeholder="Seu login"
                   autocomplete="username" required />
          </div>
        </div>

        <!-- Senha -->
        <div class="login-field">
          <label class="login-label" for="senha-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Senha
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="senha-input" class="login-input" placeholder="Sua senha"
                   autocomplete="current-password" required style="padding-right: 42px;" />
            <button type="button" class="login-eye-btn" id="toggle-senha" aria-label="Mostrar/ocultar senha">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <div class="login-btn-inner">
            <div class="login-spinner"></div>
            <span class="login-btn-text">Entrar</span>
            <svg id="btn-arrow" style="width:16px;height:16px;transition:transform 0.2s;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </button>

        <div class="login-error" id="login-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span id="login-error-text">Login ou senha inválidos</span>
        </div>
      </form>
    </div>

    <div class="login-security">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Conexão segura — Prefeitura de Inajá</span>
    </div>
  </div>

  <script>
    (function() {
      var form = document.getElementById('login-form');
      var loginInput = document.getElementById('login-input');
      var senhaInput = document.getElementById('senha-input');
      var btn = document.getElementById('login-btn');
      var errorEl = document.getElementById('login-error');
      var errorText = document.getElementById('login-error-text');
      var btnArrow = document.getElementById('btn-arrow');
      var toggleSenhaBtn = document.getElementById('toggle-senha');
      var eyeIcon = document.getElementById('eye-icon');

      // Toggle de senha
      var senhaVisible = false;
      toggleSenhaBtn.addEventListener('click', function() {
        senhaVisible = !senhaVisible;
        senhaInput.type = senhaVisible ? 'text' : 'password';
        eyeIcon.innerHTML = senhaVisible
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      // Efeito de hover no arrow
      btn.addEventListener('mouseenter', function() {
        if (!btn.disabled) btnArrow.style.transform = 'translateX(3px)';
      });
      btn.addEventListener('mouseleave', function() {
        btnArrow.style.transform = '';
      });

      // Verificar autenticação
      fetch('/api/auth/verificar').then(function(r){ return r.json(); }).then(function(d){
        if (d.autenticado) window.location.replace('/');
      }).catch(function(){});

      // Submit
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorEl.classList.remove('show');
        btn.disabled = true;
        btn.classList.add('loading');
        btnArrow.style.display = 'none';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: loginInput.value.trim(), senha: senhaInput.value })
        })
        .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
        .then(function(resp) {
          if (resp.body.ok) {
            btn.style.background = 'linear-gradient(135deg, #16a34a 0%, #15803d 100%)';
            setTimeout(function(){ window.location.replace('/'); }, 200);
          } else {
            return fetch('/api/auth/adm', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ senha: senhaInput.value })
            })
            .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
            .then(function(resp2) {
              if (resp2.body.ok) {
                btn.style.background = 'linear-gradient(135deg, #16a34a 0%, #15803d 100%)';
                setTimeout(function(){ window.location.replace('/'); }, 200);
              } else {
                errorText.textContent = resp2.body.error || 'Login ou senha inválidos';
                errorEl.classList.add('show');
              }
            });
          }
        })
        .catch(function() {
          errorText.textContent = 'Erro de conexão. Verifique sua rede e tente novamente.';
          errorEl.classList.add('show');
        })
        .finally(function() {
          btn.disabled = false;
          btn.classList.remove('loading');
          btnArrow.style.display = '';
        });
      });
    })();
  </script>
</body>
</html>
