<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural Inajá — Wireframes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #ece8dd; font-family: 'Patrick Hand', system-ui, sans-serif; color: #1f1d1a; }
    * { box-sizing: border-box; }
    /* Pin tweaks panel area */
    #root { min-height: 100vh; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- shared data has to load before babel components -->
  <script src="data.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="wf-shell.jsx"></script>
  <script type="text/babel" src="wf-ab.jsx"></script>
  <script type="text/babel" src="wf-cd.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "compact",
      "showValor": true
    }/*EDITMODE-END*/;

    // Artboard size — landscape 16:10-ish so kanban breathes
    const ARTBOARD_W = 1320;
    const ARTBOARD_H = 860;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const wireframes = [
        { id: "quiet",     label: "A · Sóbrio",                subtitle: "Refinado institucional · prioridade só na borda esquerda · monocromático",                          Comp: WFQuiet },
        { id: "compact",   label: "B · Compacto",              subtitle: "Uma linha por tarefa · cabe 15+ tarefas sem scroll · escaneia rápido",                              Comp: WFCompact },
        { id: "editorial", label: "C · Editorial",             subtitle: "Hierarquia clara · cards respiram · feeling de bloco de notas",                                     Comp: WFEditorial },
        { id: "assignee",  label: "D · Foco no responsável",   subtitle: "Avatar grande lidera · ‘é da Marina, da Roberta, do Joaquim’ antes de ser uma tarefa",              Comp: WFAssignee },
      ];

      return (
        <>
          <DesignCanvas>
            <DCSection
              id="ideas"
              title="Mural · explorações"
              subtitle="4 direções para desentupir a interface · mesma estrutura kanban, tratamentos visuais diferentes"
            >
              {wireframes.map((wf) => (
                <DCArtboard
                  key={wf.id}
                  id={wf.id}
                  label={wf.label}
                  width={ARTBOARD_W}
                  height={ARTBOARD_H}
                  style={{ background: "#f5f3ec" }}
                >
                  <div style={{ position: "relative", width: "100%", height: "100%" }}>
                    <wf.Comp density={t.density} showValor={t.showValor} />
                    <div style={{
                      position: "absolute", bottom: 10, left: 18,
                      fontFamily: "'Caveat', cursive", color: "#7a6d4a", fontSize: 17,
                      background: "rgba(245, 243, 236, 0.92)",
                      padding: "2px 8px", borderRadius: 4,
                      pointerEvents: "none",
                    }}>
                      {wf.subtitle}
                    </div>
                  </div>
                </DCArtboard>
              ))}
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Cartões" />
            <TweakRadio
              label="Densidade"
              value={t.density}
              options={["compact", "regular", "comfy"]}
              onChange={(v) => setTweak("density", v)}
            />
            <TweakToggle
              label="Mostrar valor R$"
              value={t.showValor}
              onChange={(v) => setTweak("showValor", v)}
            />
          </TweaksPanel>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
