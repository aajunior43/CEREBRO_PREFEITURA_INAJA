services:
  cerebro:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cerebro.rule=Host(`inaja.srv1767486.hstgr.cloud`)"
      - "traefik.http.routers.cerebro.entrypoints=websecure"
      - "traefik.http.routers.cerebro.tls.certresolver=letsencrypt"
      - "traefik.http.services.cerebro.loadbalancer.server.port=5000"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      - API_BASE_URL=http://cerebro:5000
    networks:
      - internal
    depends_on:
      - cerebro

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge
