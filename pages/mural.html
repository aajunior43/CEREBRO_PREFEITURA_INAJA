    async function carregarMural() {
      if (!muralLoaded) renderSkeletons();
      try {
        const res = await fetch('/api/mural');
        if (!res.ok) throw new Error("Erro ao carregar");
        const recados = await res.json();
        
        const currentUser = (sessionStorage.getItem('user_nome') || '').toLowerCase().trim();
        const isFirstLoad = (seenRecadosIds.size === 0);
        
        recados.forEach(item => {
          if (!seenRecadosIds.has(item.id)) {
            if (!isFirstLoad && currentUser) {
              const dest = (item.destinatario || '').toLowerCase().trim();
              if (dest === currentUser || dest === 'todos' || dest.includes(currentUser)) {
                const creator = (item.autor || '').toLowerCase().trim();
                if (creator !== currentUser) {
                  playNotificationSound();
                  showVisualNotification(item);
                }
              }
            }
            seenRecadosIds.add(item.id);
          }
        });

        cacheRecados = recados;
        muralLoaded = true;
        renderMural();
      } catch (e) {
        console.error(e);
      }
    }

    function renderMural() {
      const colLists = {
        a_fazer: document.querySelector('#col-a_fazer .mural-col-list'),
        em_andamento: document.querySelector('#col-em_andamento .mural-col-list'),
        concluido: document.querySelector('#col-concluido .mural-col-list')
      };
      
      const counts = { a_fazer: 0, em_andamento: 0, concluido: 0 };
      
      // Clear columns
      Object.values(colLists).forEach(el => el.innerHTML = '');
      
      const filtered = cacheRecados.filter(item => {
        if (filtroResponsavel && filtroResponsavel !== 'Todos') {
          return item.destinatario === filtroResponsavel;
        }
        return true;
      });

      filtered.forEach(item => {
        const col = item.status || 'a_fazer';
        if (colLists[col]) {
          counts[col]++;
          colLists[col].appendChild(criarCardElement(item));
        }
      });
      
      // Update Column Counts
      document.getElementById('count-a_fazer').textContent = counts.a_fazer;
      document.getElementById('count-em_andamento').textContent = counts.em_andamento;
      document.getElementById('count-concluido').textContent = counts.concluido;
      
      // Render Empty States if needed
      Object.keys(colLists).forEach(col => {
        if (counts[col] === 0) {
          const es = EMPTY_STATES[col] || { icon: '📭', title: 'Vazio', sub: '' };
          colLists[col].innerHTML = `
            <div class="mural-empty">
              <div class="mural-empty-icon">${es.icon}</div>
              <div class="mural-empty-title">${es.title}</div>
              ${es.sub ? `<div class="mural-empty-sub">${es.sub}</div>` : ''}
            </div>`;
        }
      });
    }

    function createParticleExplosion(x, y) {
      // Se as coordenadas forem inválidas, nulas ou zeradas, tenta encontrar o centro da coluna Concluído ou da tela
      if (!x || !y || x === 0 || y === 0) {
        const concluidoCol = document.querySelector('#col-concluido');
        if (concluidoCol) {
          const rect = concluidoCol.getBoundingClientRect();
          x = rect.left + rect.width / 2;
          y = rect.top + rect.height / 3;
        } else {
          x = window.innerWidth / 2;
          y = window.innerHeight / 2;
        }
      }

      const isCyber = document.documentElement.classList.contains('theme-cyberpunk');
      
      // Cores vibrantes neon para o cyberpunk, cores ricas para o padrão
      const colors = isCyber 
        ? ['#00f0ff', '#ff2d8e', '#c8ff2d', '#ffc24a', '#a124fd', '#ff0055'] 
        : ['#4f46e5', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
      
      const particleCount = isCyber ? 60 : 45; // Mais partículas para um efeito volumoso e satisfatório
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'mural-particle';
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        particle.style.backgroundColor = color;
        
        // 50% de retângulos (fitas), 50% de círculos (confetes clássicos)
        const isCircle = Math.random() > 0.5;
        const w = Math.floor(Math.random() * 8) + 6; // Largura entre 6px e 14px
        const h = isCircle ? w : Math.floor(Math.random() * 10) + 8; // Retângulos são mais alongados
        
        particle.style.width = `${w}px`;
        particle.style.height = `${h}px`;
        particle.style.borderRadius = isCircle ? '50%' : '2px';
        
        // Glow neon no tema cyberpunk ou sombra realista no clássico
        if (isCyber) {
          particle.style.boxShadow = `0 0 10px ${color}, 0 0 4px ${color}`;
        } else {
          particle.style.boxShadow = '0 2px 4px rgba(0, 0, 0, 0.15)';
        }
        
        // Posicionamento absoluto inicial via fixed para controle total por translate3d
        particle.style.left = '0';
        particle.style.top = '0';
        
        document.body.appendChild(particle);
        
        // Física em leque: atirar para cima e para fora (ângulo em radianos de -35deg a -145deg)
        const angle = -Math.PI * 0.2 - Math.random() * Math.PI * 0.6;
        const speed = Math.random() * 10 + 5; // Velocidade de 5 a 15
        
        let vx = Math.cos(angle) * speed;
        let vy = Math.sin(angle) * speed;
        
        let px = x;
        let py = y;
        
        // Rotação inicial em 3D
        let rotX = Math.random() * 360;
        let rotY = Math.random() * 360;
        let rotZ = Math.random() * 360;
        
        // Velocidade de rotação
        const rotSpeedX = (Math.random() - 0.5) * 20;
        const rotSpeedY = (Math.random() - 0.5) * 20;
        const rotSpeedZ = (Math.random() - 0.5) * 20;
        
        // Desvio de vento aleatório lateral
        const windDrift = (Math.random() - 0.5) * 0.4;
        
        const gravity = isCyber ? 0.20 : 0.26; // Queda um pouco mais flutuante no Cyberpunk
        const friction = 0.985; // Suave resistência ao ar
        
        const start = Date.now();
        const duration = Math.random() * 600 + 1000; // Tempo de vida: 1000ms a 1600ms
        
        function anim() {
          const elapsed = Date.now() - start;
          if (elapsed >= duration) {
            particle.remove();
            return;
          }
          
          const progress = elapsed / duration;
          const opacity = 1.0 - progress;
          
          // Escala diminui gradualmente no final (nos últimos 20% do ciclo de vida)
          let scale = 1.0;
          if (progress > 0.8) {
            scale = (1.0 - progress) / 0.2;
          }
          
          // Atualiza física
          vx *= friction;
          vy *= friction;
          vy += gravity;
          
          // Efeito de ondulação/flutuação (drift senoidal para imitar papel no ar)
          const sway = Math.sin(elapsed / 100 + i) * 0.5;
          px += vx + sway + windDrift;
          py += vy;
          
          // Incrementa rotações
          rotX += rotSpeedX;
          rotY += rotSpeedY;
          rotZ += rotSpeedZ;
          
          // Atualiza os estilos usando 3D acelerado por hardware
          particle.style.opacity = opacity;
          particle.style.transform = `translate3d(${px}px, ${py}px, 0) rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${scale})`;
          
          requestAnimationFrame(anim);
        }
        
        requestAnimationFrame(anim);
      }
    }

    function isStagnant(criadoEmStr) {
      if (!criadoEmStr) return false;
      try {
        const clean = criadoEmStr.split(' ')[0];
        let dateObj;
        if (clean.includes('-')) {
          const parts = clean.split('-');
          dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        } else if (clean.includes('/')) {
          const parts = clean.split('/');
          dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
        } else {
          return false;
        }
        const diffTime = Math.abs(new Date() - dateObj);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays >= 3;
      } catch (_) {
        return false;
      }
    }

    function criarCardElement(item) {
      const card = document.createElement('div');
      
      // Cor de acordo com a urgência/prioridade
      const prio = item.prioridade || 'media';
      let calculatedColor = 'yellow';
      if (prio === 'baixa') calculatedColor = 'blue';
      else if (prio === 'media') calculatedColor = 'yellow';
      else if (prio === 'alta') calculatedColor = 'orange';
      else if (prio === 'urgente') calculatedColor = 'pink';
      
      card.className = `mural-card card-color-${calculatedColor}`;
      
      const hasValor = item.valor && parseFloat(item.valor) > 0;
      if (hasValor) {
        card.classList.add('mural-card-has-valor');
      }
      
      // Build completion tags if done
      let completionMeta = '';
      if (item.status === 'concluido' && item.concluido_em) {
        completionMeta = `<span style="font-size:9px; color:#16a34a; font-weight:700;">Concluído: ${esc(item.concluido_por)} em ${item.concluido_em.split(' ')[0]}</span>`;
      }

      // Render attachments list
      let attachmentsList = '';
      if (item.attachments && item.attachments.length > 0) {
        attachmentsList = `<div class="mural-card-attachments" style="margin-top: 6px; display:flex; flex-direction:column; gap:4px;">`;
        item.attachments.forEach(att => {
          let fileIcon = '📄';
          const name = att.file_name.toLowerCase();
          if (name.endsWith('.pdf')) fileIcon = '📕';
          else if (name.endsWith('.doc') || name.endsWith('.docx')) fileIcon = '📘';
          else if (name.endsWith('.xls') || name.endsWith('.xlsx')) fileIcon = '📗';
          else if (name.endsWith('.zip') || name.endsWith('.rar')) fileIcon = '📦';
          else if (name.match(/\.(jpg|jpeg|png|gif|svg)$/)) fileIcon = '🖼️';
          
          attachmentsList += `
            <div style="display:flex; justify-content:space-between; align-items:center; background: rgba(255,255,255,0.4); padding:3px 6px; border-radius:6px; font-size:10px;">
              <a href="/api/mural/${item.id}/attachments/${att.id}/download" style="text-decoration:none; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:4px;" title="Baixar ${esc(att.file_name)}">
                <span>${fileIcon}</span>
                <span style="max-width: 145px; display:inline-block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(att.file_name)}</span>
              </a>
              <button onclick="excluirAnexo(${item.id}, ${att.id})" style="background:none; border:none; color:var(--red); cursor:pointer; font-size:9px; font-weight:bold; padding:2px 4px;" title="Remover anexo">✕</button>
            </div>
          `;
        });
        attachmentsList += `</div>`;
      } else {
        attachmentsList = '';
      }

      // Actions buttons
      let actButtons = '';
      actButtons += `<button class="mural-card-act" onclick="editarRecado(${item.id})" title="Editar recado" style="color:var(--orange);width:auto;padding:0 8px;font-size:11px;font-weight:700;">✏️ Editar</button>`;
      actButtons += `<button class="mural-card-act" onclick="triggerAnexoUpload(${item.id})" title="Anexar arquivo" style="color:var(--blue);">📎</button>`;
      if (item.status === 'a_fazer') {
        actButtons += `<button class="mural-card-act mural-card-act-done" onclick="alterarStatusRecado(${item.id}, 'em_andamento')" title="Iniciar tarefa">⚡</button>`;
      } else if (item.status === 'em_andamento') {
        actButtons += `<button class="mural-card-act mural-card-act-done" onclick="alterarStatusRecado(${item.id}, 'concluido')" title="Marcar como concluída">✓</button>`;
      } else if (item.status === 'concluido') {
        actButtons += `<button class="mural-card-act" onclick="alterarStatusRecado(${item.id}, 'a_fazer')" title="Reabrir tarefa" style="color:var(--blue);">↩</button>`;
      }
      actButtons += `<button class="mural-card-act mural-card-act-delete" onclick="excluirRecado(${item.id})" title="Excluir recado">✕</button>`;

      // Render valor badge if present
      let valorBadge = '';
      if (item.valor && parseFloat(item.valor) > 0) {
        const formatted = Number(item.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        valorBadge = `<span class="mural-valor-badge">💰 ${formatted}</span>`;
      }

      const dest = item.destinatario || 'Todos';
      const isAll = dest === 'Todos';
      const initial = isAll ? '👥' : dest.charAt(0).toUpperCase();
      
      let assigneeBg = 'linear-gradient(135deg, var(--blue), var(--purple))';
      if (!isAll) {
        const char = initial;
        const colors = {
          'A': '#3b6db8', 'B': '#4a8a5a', 'C': '#cb6a2a', 'D': '#8a5a8c',
          'E': '#7a6d4a', 'F': '#3b6db8', 'G': '#4a8a5a', 'H': '#cb6a2a',
          'I': '#8a5a8c', 'J': '#4d6b8a', 'K': '#7a6d4a', 'L': '#3b6db8',
          'M': '#8a5a8c', 'N': '#4a8a5a', 'O': '#cb6a2a', 'P': '#7a6d4a',
          'Q': '#3b6db8', 'R': '#7a6d4a', 'S': '#8a5a8c', 'T': '#4a8a5a',
          'U': '#cb6a2a', 'V': '#7a6d4a', 'W': '#3b6db8', 'X': '#8a5a8c',
          'Y': '#4a8a5a', 'Z': '#cb6a2a'
        };
        assigneeBg = colors[char] || '#4d6b8a';
      }

      const assigneeAvatar = `
        <div class="mural-card-assignee-avatar" style="background:${assigneeBg};" title="Designado para: ${esc(dest)}">
          ${initial}
        </div>
      `;

      // Calcula se está estagnado (mais de 3 dias nas colunas A Fazer ou Em Progresso)
      let stagnantDot = '';
      if (item.status !== 'concluido' && isStagnant(item.criado_em)) {
        stagnantDot = `<span class="mural-pulse-dot" title="Pendente há mais de 3 dias!"></span>`;
      }

      card.innerHTML = `
        <div class="mural-card-header" style="display:flex; gap:10px; align-items:flex-start;">
          ${assigneeAvatar}
          <div style="flex:1; min-width:0; overflow:hidden;">
            <div class="mural-card-title">${esc(item.titulo)}</div>
            <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-top:5px;">
              ${valorBadge}
              <span class="mural-badge badge-prioridade-${item.prioridade}">${esc(item.prioridade)}${stagnantDot}</span>
              <span class="mural-badge" style="background:rgba(0,0,0,0.04); color:var(--text-2); border:1px solid var(--border); text-transform:none;">👤 ${esc(dest)}</span>
            </div>
          </div>
          <div class="mural-card-actions" style="margin-left:auto;">
            ${actButtons}
          </div>
        </div>
        <div class="mural-card-body">
          <div style="line-height:1.45; color:var(--text-2); font-weight:500;">${esc(item.conteudo)}</div>
          ${attachmentsList}
        </div>
        <div class="mural-card-footer">
          <div class="mural-card-meta" style="font-size:9px;">
            <span class="mural-card-author">✍ ${esc(item.autor)}</span>
            <span style="opacity:0.5;">•</span>
            <span style="opacity:0.7;">📅 ${esc((item.criado_em || '').split(' ')[0])}</span>
            ${completionMeta ? `<span style="opacity:0.5;">•</span>${completionMeta}` : ''}
          </div>
        </div>
      `;
      // Drag & Drop to attach files directly to the card
      card.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('Files')) {
          e.preventDefault();
          e.stopPropagation();
          card.style.border = '2px dashed var(--blue)';
          card.style.transform = 'scale(1.01)';
        }
      });

      card.addEventListener('dragenter', (e) => {
        if (e.dataTransfer.types.includes('Files')) {
          e.preventDefault();
          e.stopPropagation();
          card.style.border = '2px dashed var(--blue)';
          card.style.transform = 'scale(1.01)';
        }
      });

      card.addEventListener('dragleave', () => {
        card.style.border = '';
        card.style.transform = '';
      });

      card.addEventListener('drop', async (e) => {
        if (!e.dataTransfer.types.includes('Files')) return;
        e.preventDefault();
        e.stopPropagation();
        card.style.border = '';
        card.style.transform = '';

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          await enviarAnexoArquivo(item.id, file);
        }
      });

      // Make card draggable for Kanban column drag & drop
      card.draggable = true;
      
      card.addEventListener('dragstart', (e) => {
        // Store task ID in dataTransfer
        e.dataTransfer.setData('text/plain', item.id);
        card.classList.add('mural-card-dragging');
      });
      
      card.addEventListener('dragend', () => {
        card.classList.remove('mural-card-dragging');
      });

      return card;
    }

    async function alterarStatusRecado(id, novoStatus) {
      const currentUser = sessionStorage.getItem('user_nome') || '';
      // Optimistic Update: change status instantly in memory cache and re-render
      const item = cacheRecados.find(r => r.id === id);
      const oldStatus = item ? item.status : null;
      if (item) {
        item.status = novoStatus;
        if (novoStatus === 'concluido' && currentUser) {
          item.concluido_por = currentUser;
          item.concluido_em = new Date().toLocaleString('pt-BR');
          
          // Dispara a animação de partículas com base no clique
          const e = window.event;
          if (e && e.clientX && e.clientY) {
            createParticleExplosion(e.clientX, e.clientY);
          }
        }
        renderMural();
      }

      const body = { status: novoStatus };
      if (novoStatus === 'concluido' && currentUser) body.concluido_por = currentUser;

      try {
        const res = await fetch(`/api/mural/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          if (item && oldStatus) {
            item.status = oldStatus;
            renderMural();
          }
          carregarMural();
        }
      } catch (e) {
        console.error(e);
        if (item && oldStatus) {
          item.status = oldStatus;
          renderMural();
        }
        carregarMural();
      }
    }

    async function excluirRecado(id) {
      if (!confirm("Excluir definitivamente este recado do mural?")) return;

      // Optimistic Delete: remove instantly from cache and re-render
      const index = cacheRecados.findIndex(r => r.id === id);
      let tempRemoved = null;
      if (index !== -1) {
        tempRemoved = cacheRecados.splice(index, 1)[0];
        renderMural();
      }

      try {
        const res = await fetch(`/api/mural/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          // Rollback on failure
          if (tempRemoved) {
            cacheRecados.push(tempRemoved);
            renderMural();
          }
          let errMsg = 'Erro ao excluir recado.';
          if (res.status === 403) errMsg = 'Sem permissão para excluir este recado.';
          showMuralToast(errMsg, 'error');
          carregarMural();
        }
      } catch (e) {
        console.error(e);
        if (tempRemoved) {
          cacheRecados.push(tempRemoved);
          renderMural();
        }
        showMuralToast('Erro de conexão ao excluir recado.', 'error');
        carregarMural();
      }
    }

    window.editarRecado = function(id) {
      const item = cacheRecados.find(r => r.id === id);
      if (!item) return;
      
      document.getElementById('mural-form').reset();
      document.getElementById('form-id').value = item.id;
      document.getElementById('form-titulo').value = item.titulo;
      document.getElementById('form-conteudo').value = item.conteudo;

      document.getElementById('form-prioridade').value = item.prioridade;
      document.getElementById('form-autor').value = item.autor;
      document.getElementById('form-destinatario').value = item.destinatario || 'Todos';
      document.getElementById('form-valor').value = item.valor ? Number(item.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
      
      document.getElementById('modal-title').textContent = 'Editar Recado / Tarefa';
      document.getElementById('mural-comments-section').style.display = 'block';
      carregarComentarios(item.id);
      backdrop.classList.add('active');
    };

    // Modal Control
    const backdrop = document.getElementById('modal-backdrop');
    
    document.getElementById('btn-novo-recado').addEventListener('click', () => {
      document.getElementById('mural-form').reset();
      document.getElementById('form-id').value = '';
      document.getElementById('form-valor').value = '';
      document.getElementById('modal-title').textContent = 'Novo Recado no Mural';
      document.getElementById('mural-comments-section').style.display = 'none';
      loadSessionAuthor();
      backdrop.classList.add('active');
    });

    document.getElementById('btn-fechar-modal').addEventListener('click', () => backdrop.classList.remove('active'));
    document.getElementById('btn-cancelar').addEventListener('click', () => backdrop.classList.remove('active'));

    // Form Submit
    document.getElementById('mural-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('form-id').value;
      
      const prio = document.getElementById('form-prioridade').value;
      let calculatedColor = 'yellow';
      if (prio === 'baixa') calculatedColor = 'blue';
      else if (prio === 'media') calculatedColor = 'yellow';
      else if (prio === 'alta') calculatedColor = 'orange';
      else if (prio === 'urgente') calculatedColor = 'pink';

      const rawValor = document.getElementById('form-valor').value.trim();
      let valorNum = 0.0;
      if (rawValor) {
        try {
          const cleaned = rawValor.replace("R$", "").replace(/\s/g, "").replace(/\./g, "").replace(",", ".").trim();
          valorNum = parseFloat(cleaned) || 0.0;
        } catch (err_val) {
          valorNum = 0.0;
        }
      }

      const payload = {
        titulo: document.getElementById('form-titulo').value.trim(),
        conteudo: document.getElementById('form-conteudo').value.trim(),

        prioridade: prio,
        autor: document.getElementById('form-autor').value.trim(),
        destinatario: document.getElementById('form-destinatario').value.trim(),
        cor: calculatedColor,
        valor: valorNum
      };

      const url = id ? `/api/mural/${id}` : '/api/mural';
      const method = id ? 'PUT' : 'POST';

      // Close modal instantly for zero-latency feel
      backdrop.classList.remove('active');

      // Optimistic update for Edit Mode
      let originalItem = null;
      if (id) {
        const itemId = parseInt(id, 10);
        originalItem = cacheRecados.find(r => r.id === itemId);
        if (originalItem) {
          // Temporarily merge payload
          Object.assign(originalItem, payload);
          renderMural();
        }
      }

      // Optimistic create: show card immediately before server responds
      let tempItem = null;
      if (!id) {
        tempItem = Object.assign({}, payload, {
          id: -Date.now(), // temporary negative ID to avoid collision
          status: 'a_fazer',
          criado_em: new Date().toLocaleString('pt-BR'),
          concluido_por: '',
          concluido_em: '',
          attachments: []
        });
        cacheRecados.unshift(tempItem);
        renderMural();
      }

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const createdRecado = await res.json();
          createdRecado.attachments = createdRecado.attachments || [];

          if (!id) {
            // Replace temp item with real server data
            const idx = cacheRecados.findIndex(r => r.id === tempItem.id);
            if (idx !== -1) cacheRecados[idx] = createdRecado;
            seenRecadosIds.add(createdRecado.id); // prevent duplicate notification from SSE
            renderMural();
          }

          // Handle file attachment if any
          const modalFileInput = document.getElementById('form-file');
          if (modalFileInput.files && modalFileInput.files.length > 0) {
            const formData = new FormData();
            formData.append('file', modalFileInput.files[0]);
            await fetch(`/api/mural/${createdRecado.id}/attachments`, {
              method: 'POST',
              body: formData
            });
            carregarMural(); // reload only when there's an attachment to sync
          }
        } else {
          // Rollback temp item and show error
          if (tempItem) {
            const idx = cacheRecados.findIndex(r => r.id === tempItem.id);
            if (idx !== -1) cacheRecados.splice(idx, 1);
          }
          if (originalItem) Object.assign(originalItem, originalItem);
          let errMsg = 'Erro ao salvar recado.';
          try {
            const errData = await res.json();
            if (errData.error) errMsg = errData.error;
          } catch (_) {}
          if (res.status === 403) errMsg = 'Sem permissão para editar este recado. Apenas o autor ou o administrador pode editar.';
          showMuralToast(errMsg, 'error');
          carregarMural();
        }
      } catch (err) {
        console.error(err);
        if (tempItem) {
          const idx = cacheRecados.findIndex(r => r.id === tempItem.id);
          if (idx !== -1) cacheRecados.splice(idx, 1);
        }
        showMuralToast('Erro de conexão ao salvar recado.', 'error');
        carregarMural();
      }
    });

    // Toolbar
    document.getElementById('btn-atualizar').addEventListener('click', carregarMural);

    // Setup Column Drop Targets for Kanban Drag & Drop
    document.querySelectorAll('.mural-col-list').forEach(listEl => {
      const colEl = listEl.closest('.mural-col');
      const targetStatus = colEl.getAttribute('data-status');
      
      listEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        listEl.classList.add('drag-over');
      });

      listEl.addEventListener('dragenter', (e) => {
        e.preventDefault();
        listEl.classList.add('drag-over');
      });

      listEl.addEventListener('dragleave', () => {
        listEl.classList.remove('drag-over');
      });

      listEl.addEventListener('drop', async (e) => {
        if (e.dataTransfer.types.includes('Files')) return;
        e.preventDefault();
        listEl.classList.remove('drag-over');

        const taskIdStr = e.dataTransfer.getData('text/plain');
        if (taskIdStr) {
          const taskId = parseInt(taskIdStr, 10);
          if (!isNaN(taskId)) {
            const task = cacheRecados.find(r => r.id === taskId);
            if (task && task.status !== targetStatus) {
              if (targetStatus === 'concluido') {
                createParticleExplosion(e.clientX, e.clientY);
              }
              await alterarStatusRecado(taskId, targetStatus);
            }
          }
        }
      });
    });

    // Attachment JS Handlers
    let currentUploadRecadoId = null;

    window.triggerAnexoUpload = function(recadoId) {
      currentUploadRecadoId = recadoId;
      const fileInput = document.getElementById('mural-hidden-file-input');
      // Reset o valor ANTES de abrir o dialog — essencial para que onchange
      // dispare mesmo quando o mesmo arquivo é selecionado novamente
      fileInput.value = '';
      fileInput.click();
    };

    async function enviarAnexoArquivo(recadoId, file) {
      // Feedback visual imediato
      showMuralToast(`📎 Enviando "${file.name}"...`, 'info');
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const res = await fetch(`/api/mural/${recadoId}/attachments`, {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          showMuralToast(`✅ Anexo "${file.name}" enviado com sucesso!`, 'success');
          carregarMural();
        } else {
          let errMsg = 'Erro ao enviar anexo';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch(_) {}
          showMuralToast(`❌ ${errMsg}`, 'error');
        }
      } catch (e) {
        console.error('Erro ao enviar arquivo:', e);
        showMuralToast('❌ Erro de rede ao enviar arquivo', 'error');
      }
    }

    window.handleAnexoFileChange = async function() {
      const fileInput = document.getElementById('mural-hidden-file-input');
      if (!fileInput.files || fileInput.files.length === 0 || !currentUploadRecadoId) return;
      
      const file = fileInput.files[0];
      const id = currentUploadRecadoId;
      currentUploadRecadoId = null;
      fileInput.value = '';
      await enviarAnexoArquivo(id, file);
    };

    // Registra o listener de change via addEventListener como reforço robusto
    // (O elemento já existe no DOM pois o script é inline, não é necessário DOMContentLoaded)
    (function() {
      const fi = document.getElementById('mural-hidden-file-input');
      if (fi) {
        fi.addEventListener('change', window.handleAnexoFileChange);
      }
    })();

    window.excluirAnexo = async function(recadoId, attachmentId) {
      if (!confirm("Excluir este anexo?")) return;
      try {
        const res = await fetch(`/api/mural/${recadoId}/attachments/${attachmentId}`, {
          method: 'DELETE'
        });
        if (res.ok) carregarMural();
      } catch (e) {
        console.error(e);
      }
    };

    // Comments Client Handlers
    async function carregarComentarios(recadoId) {
      const list = document.getElementById('mural-comments-list');
      list.innerHTML = '<div style="font-size:11px;color:var(--text-3);text-align:center;padding:8px 0;">Carregando comentários...</div>';
      try {
        const res = await fetch(`/api/mural/${recadoId}/comments`);
        if (res.ok) {
          const comments = await res.json();
          if (comments.length === 0) {
            list.innerHTML = '<div style="font-size:11px;color:var(--text-3);text-align:center;font-style:italic;padding:8px 0;">Nenhum comentário ainda.</div>';
            return;
          }
          list.innerHTML = comments.map(c => `
            <div style="background:var(--bg-2, var(--surface-2)); padding:8px 10px; border-radius:10px; font-size:11px; line-height:1.3; border: 1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; font-weight:800; font-size:10px; color:var(--text-2); margin-bottom:2px;">
                <span>${esc(c.autor)}</span>
                <span style="font-weight:normal; opacity:0.7; font-size:9px; margin-left:auto;">${esc(c.criado_em.split(' ')[1] || c.criado_em)}</span>
              </div>
              <div style="color:var(--text); white-space:pre-wrap;">${esc(c.texto)}</div>
            </div>
          `).join('');
          list.scrollTop = list.scrollHeight;
        }
      } catch (e) {
        list.innerHTML = '<div style="font-size:11px;color:var(--red);text-align:center;">Erro ao carregar comentários.</div>';
      }
    }

    document.getElementById('btn-mural-send-comment').addEventListener('click', async () => {
      const input = document.getElementById('mural-comment-input');
      const text = input.value.trim();
      const recadoId = document.getElementById('form-id').value;
      if (!text || !recadoId) return;
      
      const payload = {
        texto: text,
        autor: sessionStorage.getItem('user_nome') || 'Servidor'
      };
      
      try {
        const res = await fetch(`/api/mural/${recadoId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          input.value = '';
          carregarComentarios(recadoId);
        }
      } catch (e) {
        console.error(e);
      }
    });

    // Realtime SSE Listener
    function initMuralSSE() {
      const source = new EventSource('/api/mural/events');
      
      source.addEventListener('create', function(e) {
        const item = JSON.parse(e.data);

        // Remove temp optimistic item (negative ID) from the same author if present
        const tempIdx = cacheRecados.findIndex(r => r.id < 0 && r.autor === item.autor && r.titulo === item.titulo);
        if (tempIdx !== -1) cacheRecados.splice(tempIdx, 1);

        if (!cacheRecados.some(r => r.id === item.id)) {
          cacheRecados.unshift(item);

          // Sound and toast notification for destinatario
          const currentUser = (sessionStorage.getItem('user_nome') || '').toLowerCase().trim();
          if (currentUser) {
            const dest = (item.destinatario || '').toLowerCase().trim();
            if (dest === currentUser || dest === 'todos' || dest.includes(currentUser)) {
              const creator = (item.autor || '').toLowerCase().trim();
              if (creator !== currentUser) {
                playNotificationSound();
                showVisualNotification(item);
              }
            }
          }

          renderMural();
        }
      });
      
      source.addEventListener('update', function(e) {
        const item = JSON.parse(e.data);
        const index = cacheRecados.findIndex(r => r.id === item.id);
        if (index !== -1) {
          cacheRecados[index] = item;
          renderMural();
          
          const openId = document.getElementById('form-id').value;
          if (openId && parseInt(openId, 10) === item.id && backdrop.classList.contains('active')) {
            carregarComentarios(item.id);
          }
        }
      });
      
      source.addEventListener('delete', function(e) {
        const data = JSON.parse(e.data);
        const index = cacheRecados.findIndex(r => r.id === data.id);
        if (index !== -1) {
          cacheRecados.splice(index, 1);
          renderMural();
          
          const openId = document.getElementById('form-id').value;
          if (openId && parseInt(openId, 10) === data.id) {
            backdrop.classList.remove('active');
          }
        }
      });
      
      source.addEventListener('comment', function(e) {
        const data = JSON.parse(e.data);
        const openId = document.getElementById('form-id').value;
        if (openId && parseInt(openId, 10) === data.recado_id && backdrop.classList.contains('active')) {
          carregarComentarios(data.recado_id);
        }
      });
      
      source.onerror = function() {
        console.warn("SSE connection lost. Reconnecting...");
      };
    }

    // Init Page load
    carregarMural();
    initMuralSSE();
    
    // Auto-refresh fallback every 30 seconds to ensure consistency
    setInterval(carregarMural, 30000);
  </script>
</body>
</html>
