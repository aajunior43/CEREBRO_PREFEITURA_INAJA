<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural</title>
  <link rel="stylesheet" href="/static/css/index.css" />
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);var mt=localStorage.getItem('mural_theme');if(mt==='cyberpunk')document.documentElement.classList.add('theme-cyberpunk');}());</script>
  <script>
    // Bloqueia renderização imediatamente antes de qualquer HTML ser exibido
    document.documentElement.style.visibility = 'hidden';
    (function checkAuth() {
      fetch('/api/auth/verificar').then(function(r){return r.json()}).then(function(d){
        if (d.autenticado) {
          sessionStorage.setItem('adm_auth', '1');
          sessionStorage.setItem('user_nome', d.nome || '');
          sessionStorage.setItem('user_nivel', d.nivel || '');
          document.documentElement.style.visibility = '';
        } else {
          sessionStorage.clear();
          window.location.replace('/login.html');
        }
      }).catch(function(){
        window.location.replace('/login.html');
      });
    })();
  </script>
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <script defer src="/static/js/shared-header.js"></script>
  <script src="/static/js/ia-chat-widget.js"></script>
  <style>
    @keyframes shine-animation {
      to { background-position: 200% center; }
    }
    /* PAGE ROOT Gradient matching KANBAN style */
    .mural-page {
      min-height: calc(100vh - 64px);
      padding: 28px 24px 72px;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--blue) 14%, transparent), transparent 24%),
        radial-gradient(circle at top right, color-mix(in srgb, var(--purple) 14%, transparent), transparent 20%),
        linear-gradient(180deg, color-mix(in srgb, var(--surface) 10%, transparent), transparent),
        var(--bg);
    }
    
    .mural-wrap { 
      max-width: 1680px; 
      margin: 0 auto; 
    }

    /* PREMIUM HERO HEADER */
    .mural-hero { 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      gap: 18px; 
      margin-bottom: 24px; 
      flex-wrap: wrap; 
      padding: 22px 24px;
      border-radius: 22px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--surface) 94%, transparent), color-mix(in srgb, var(--surface-2) 88%, transparent));
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
    }
    .mural-hero-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      color: #fff;
      font-size: 24px;
    }
    .mural-hero-text {
      flex: 1;
      min-width: 250px;
    }
    .mural-hero h2 { 
      font-size: clamp(22px, 4vw, 30px); 
      font-weight: 800; 
      color: var(--text); 
      margin: 0; 
      letter-spacing: -.03em;
    }
    .mural-hero p { 
      font-size: 13px; 
      color: var(--text-3); 
      margin: 6px 0 0; 
      line-height: 1.6;
    }
    
    /* GLASSMORPHISM TOOLBAR */
    .mural-toolbar { 
      background: color-mix(in srgb, var(--surface) 82%, transparent); 
      border-radius: 18px; 
      box-shadow: var(--shadow); 
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      padding: 14px 16px; 
      margin-bottom: 24px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 16px;
      flex-wrap: wrap;
    }
    .mural-filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; flex: 1; }
    .mural-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 12px;
      flex: 1;
      min-width: 220px;
      max-width: 400px;
    }
    .mural-search-input {
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      width: 100%;
    }
    .mural-select {
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      padding: 9px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .mural-select:hover {
      border-color: var(--border-hover);
    }
    
    /* BUTTONS */
    .mural-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 42px;
      white-space: nowrap;
    }
    .mural-btn-primary {
      background: var(--grad-blue);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .mural-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .mural-btn-ghost {
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      color: var(--text-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .mural-btn-ghost:hover {
      box-shadow: var(--shadow);
      color: var(--text);
      transform: translateY(-2px);
    }

    /* COLUMNS GRID */
    .mural-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      align-items: start;
    }
    .mural-col {
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), color-mix(in srgb, var(--surface-2) 92%, transparent));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 210px);
      min-height: 320px;
      backdrop-filter: blur(10px);
      padding: 0;
      gap: 0;
    }
    .mural-col-head {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }
    
    .mural-col-todo .mural-col-head { border-top: 3px solid var(--blue); }
    .mural-col-progress .mural-col-head { border-top: 3px solid var(--orange); }
    .mural-col-done .mural-col-head { border-top: 3px solid var(--green); }

    .mural-col-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mural-col-count {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--surface-2) 90%, transparent);
      color: var(--text-2);
      transition: background 0.2s, color 0.2s;
    }
    .mural-col-todo    .mural-col-count { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
    .mural-col-progress .mural-col-count { background: color-mix(in srgb, var(--orange) 14%, transparent); color: var(--orange); }
    .mural-col-done    .mural-col-count { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green-dark, #15803d); }

    .mural-col-list {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 16%, transparent), color-mix(in srgb, var(--surface-2) 10%, transparent));
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .mural-col-list::-webkit-scrollbar { width: 4px; }
    .mural-col-list::-webkit-scrollbar-track { background: transparent; }
    .mural-col-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* CARD STYLE */
    .mural-card {
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.22s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 3px solid var(--note-border);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow: visible;
      animation: cardSlideIn 0.22s ease both;
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .mural-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    
    /* Card com VALOR destacado no mural */
    .mural-card-has-valor {
      --note-border: #f59e0b !important;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, #f59e0b 6%, var(--surface)) 0%,
        color-mix(in srgb, var(--surface-2) 94%, transparent) 100%
      ) !important;
      box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, #f59e0b 28%, transparent) !important;
    }
    .mural-card-has-valor:hover {
      box-shadow: var(--shadow-lg), 0 0 0 2px color-mix(in srgb, #f59e0b 40%, transparent) !important;
    }
    
    /* Tailored HSL Colors for dark and light matching the system perfectly */
    .card-color-yellow  { --note-border: var(--orange); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(245, 158, 11, 0.03)); }
    .card-color-blue    { --note-border: var(--blue); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(59, 130, 246, 0.03)); }
    .card-color-green   { --note-border: var(--green); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(16, 185, 129, 0.03)); }
    .card-color-pink    { --note-border: var(--red); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(239, 68, 68, 0.03)); animation: urgente-card-flash 2.2s ease-in-out infinite; }

    @keyframes urgente-card-flash {
      0%, 100% { box-shadow: var(--shadow-sm); }
      50%      { box-shadow: 0 0 7px 2px rgba(220, 38, 38, 0.28), var(--shadow-sm); }
    }
    .card-color-purple  { --note-border: var(--purple); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(139, 92, 246, 0.03)); }
    .card-color-orange  { --note-border: var(--orange-dark); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), rgba(249, 115, 22, 0.03)); }

    [data-theme="dark"] .card-color-yellow { background: linear-gradient(180deg, var(--surface), rgba(245, 158, 11, 0.015)); }
    [data-theme="dark"] .card-color-blue   { background: linear-gradient(180deg, var(--surface), rgba(59, 130, 246, 0.015)); }
    [data-theme="dark"] .card-color-green  { background: linear-gradient(180deg, var(--surface), rgba(16, 185, 129, 0.015)); }
    [data-theme="dark"] .card-color-pink   { background: linear-gradient(180deg, var(--surface), rgba(239, 68, 68, 0.015)); }
    [data-theme="dark"] .card-color-purple { background: linear-gradient(180deg, var(--surface), rgba(139, 92, 246, 0.015)); }
    [data-theme="dark"] .card-color-orange { background: linear-gradient(180deg, var(--surface), rgba(249, 115, 22, 0.015)); }

    .mural-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .mural-card-assignee-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      user-select: none;
    }
    .mural-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 6px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--surface-2) 90%, transparent);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mural-filter-chip:hover {
      border-color: var(--border-hover);
      color: var(--text);
      transform: translateY(-1px);
    }
    .mural-filter-chip.active {
      background: var(--surface) !important;
      border-color: var(--blue) !important;
      color: var(--blue) !important;
      box-shadow: 0 0 10px color-mix(in srgb, var(--blue) 25%, transparent) !important;
    }
    .mural-filter-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .mural-card.mural-card-dragging {
      transform: scale(1.02) rotate(-2deg) !important;
      box-shadow: var(--shadow-lg) !important;
      opacity: 0.7 !important;
      transition: transform 0.1s ease !important;
    }
    .mural-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulsingUrgencyDot 1.6s infinite;
      margin-left: 6px;
      vertical-align: middle;
    }
    @keyframes pulsingUrgencyDot {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
    .mural-particle {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      will-change: transform, opacity;
      transform-style: preserve-3d;
    }
    .mural-card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      letter-spacing: -0.01em;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mural-card-body {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.45;
      white-space: pre-wrap;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .mural-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--text-3);
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      flex-wrap: wrap;
      gap: 6px;
    }
    .mural-card-meta {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      row-gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .mural-card-author {
      font-weight: 800;
      color: var(--text-2);
    }
    
    /* Badges */
    .mural-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    
    .mural-valor-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      background: linear-gradient(135deg, color-mix(in srgb, #f59e0b 18%, transparent), color-mix(in srgb, #d97706 12%, transparent));
      color: #b45309;
      border: 1px solid color-mix(in srgb, #f59e0b 30%, transparent);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    [data-theme="dark"] .mural-valor-badge {
      background: linear-gradient(135deg, rgba(245,158,11,.22), rgba(217,119,6,.16));
      color: #fbbf24;
      border-color: rgba(245,158,11,.32);
    }
    
    .badge-prioridade-baixa   { background: rgba(16, 185, 129, .12); color: #059669; }
    .badge-prioridade-media   { background: rgba(245, 158, 11, .12); color: #d97706; }
    .badge-prioridade-alta    { background: rgba(249, 115, 22, 0.15); color: #ea580c; }
    .badge-prioridade-urgente { background: rgba(239, 68, 68, 0.15); color: #dc2626; animation: pulse-urgente 2s infinite; font-weight: 800; }
    
    @keyframes pulse-urgente {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }



    /* Actions Panel inside Card */
    .mural-card-actions {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-shrink: 0;
      margin-left: auto;
    }
    .mural-card-act {
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--border);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      font-size: 14px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }
    .mural-card-act:hover {
      background: var(--border);
      color: var(--text);
      transform: translateY(-1px);
    }
    .mural-card-act-done {
      color: #16a34a;
    }
    .mural-card-act-delete {
      color: #dc2626;
    }

    /* Modal Backdrop style upgrade */
    .mural-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0; pointer-events: none;
      transition: all 0.22s;
    }
    .mural-modal-backdrop.active {
      opacity: 1; pointer-events: auto;
    }
    .mural-modal {
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      width: 92%;
      max-width: 520px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transform: scale(0.92);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mural-modal-backdrop.active .mural-modal {
      transform: scale(1);
    }
    .mural-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .mural-modal-header h3 { font-size: 18px; font-weight: 850; color: var(--text); margin: 0; letter-spacing: -0.02em; }
    .mural-modal-close {
      background: none; border: none; font-size: 24px; color: var(--text-3); cursor: pointer; transition: color 0.15s;
    }
    .mural-modal-close:hover { color: var(--red); }
    
    .mural-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mural-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Empty Column style */
    .mural-empty {
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      padding: 36px 18px;
      border: 1.5px dashed var(--border-hover);
      border-radius: 16px;
      background: color-mix(in srgb, var(--surface) 50%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .mural-empty-icon { font-size: 30px; opacity: 0.5; }
    .mural-empty-title { font-weight: 700; font-size: 13px; }
    .mural-empty-sub { font-size: 11px; opacity: 0.7; }

    /* Skeleton loading */
    @keyframes skeleton-shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .mural-skeleton-card {
      border-radius: 14px;
      padding: 14px 16px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mural-skeleton-line {
      border-radius: 6px;
      background: linear-gradient(90deg, var(--border) 25%, color-mix(in srgb, var(--border) 60%, var(--surface)) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.6s ease-in-out infinite;
    }

    /* Drag-over column highlight */
    .mural-col-list.drag-over {
      background: color-mix(in srgb, var(--blue) 7%, transparent) !important;
      outline: 2px dashed color-mix(in srgb, var(--blue) 35%, transparent);
      outline-offset: -4px;
      border-radius: 14px;
    }

    /* User chip top-right */
    .mural-user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: color-mix(in srgb, var(--surface) 85%, transparent);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px 6px 8px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
    }
    .mural-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }
    .mural-user-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .mural-user-nome {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .mural-user-nivel {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .mural-btn-sair {
      background: color-mix(in srgb, var(--red) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
      color: var(--red);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mural-btn-sair:hover {
      background: color-mix(in srgb, var(--red) 20%, transparent);
      transform: translateY(-1px);
    }

    @media (max-width: 1080px) {
      .mural-columns { grid-template-columns: 1fr; gap: 20px; }
      .mural-col { min-height: auto; }
    }

    /* =============================================================================
       CYBERPUNK THEME INTEGRATION (DYNAMIC)
       ============================================================================= */
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

    html.theme-cyberpunk {
      --bg-deep:   #05070f;
      --bg-panel:  #0a0e1c;
      --bg-card:   #0f1426;
      --line:      #1a2342;
      --line-hi:   #2a3866;
      --ink:       #e8eef8;
      --ink-2:     #a0aec8;
      --ink-3:     #5a6a8a;
      --ink-4:     #3a4868;

      --accent:    #00f0ff;   /* Ciano */
      --accent-2:  #ff2d8e;   /* Magenta */
      --accent-3:  #c8ff2d;   /* Lime */
      --gold:      #ffc24a;

      --p-urg:     #ff2d4f;
      --p-alt:     #ff8a3d;
      --p-med:     #ffc24a;
      --p-bai:     #4dffa0;

      --bg: var(--bg-deep);
      --surface: var(--bg-panel);
      --surface-2: var(--bg-card);
      --border: var(--line);
      --border-hover: var(--line-hi);
      --text: var(--ink);
      --text-2: var(--ink-2);
      --text-3: var(--ink-3);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.5);
      --shadow: 0 4px 16px rgba(0,0,0,0.6);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.8);
      
      --blue: #4d9eff;
      --orange: #ff8a3d;
      --green: #4dffa0;
      --red: #ff2d4f;
    }

    html.theme-cyberpunk body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px) 0 0 / 100% 28px,
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px) 0 0 / 28px 100%;
      mask: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 90%);
      opacity: 0.5;
    }
    html.theme-cyberpunk body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
      opacity: 0.35;
      mix-blend-mode: overlay;
    }

    .glow-blob {
      display: none;
    }
    html.theme-cyberpunk .glow-blob {
      display: block;
      position: fixed; pointer-events: none; z-index: 0;
      width: 600px; height: 600px; border-radius: 50%;
      filter: blur(120px); opacity: 0.12;
    }
    html.theme-cyberpunk .glow-blob.a { top: -200px; left: -200px; background: var(--accent); }
    html.theme-cyberpunk .glow-blob.b { bottom: -200px; right: -200px; background: var(--accent-2); }

    html.theme-cyberpunk .mural-page {
      background: var(--bg-deep) !important;
      font-family: 'Chakra Petch', sans-serif !important;
    }
    
    html.theme-cyberpunk .mural-hero {
      background: var(--bg-panel) !important;
      border: 1px solid var(--line) !important;
      border-top: 3px solid var(--accent) !important;
      border-radius: 4px !important;
      position: relative;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.1) !important;
    }
    html.theme-cyberpunk .mural-hero h2 {
      font-family: 'Chakra Petch', sans-serif !important;
      font-weight: 700 !important;
      background: linear-gradient(120deg, #d4af37 0%, #fef1c9 25%, #ffd66e 50%, #fef1c9 75%, #d4af37 100%) !important;
      background-size: 200% auto !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      filter: drop-shadow(0 0 12px rgba(255, 194, 74, 0.3)) !important;
    }

    html.theme-cyberpunk .mural-toolbar {
      background: rgba(255, 255, 255, 0.01) !important;
      border: 1px solid var(--line) !important;
      border-radius: 4px !important;
    }

    html.theme-cyberpunk .mural-col {
      border-radius: 4px !important;
      border: 1px solid var(--line) !important;
      background: var(--bg-panel) !important;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.03) !important;
    }
    html.theme-cyberpunk .mural-col-head {
      background: linear-gradient(180deg, rgba(255,255,255,.015), transparent 80%) !important;
      border-bottom: 1px solid var(--line) !important;
    }
    html.theme-cyberpunk .mural-col-todo .mural-col-head { border-top: 3px solid var(--blue) !important; }
    html.theme-cyberpunk .mural-col-progress .mural-col-head { border-top: 3px solid var(--orange) !important; }
    html.theme-cyberpunk .mural-col-done .mural-col-head { border-top: 3px solid var(--green) !important; }
    
    html.theme-cyberpunk .mural-col-title {
      font-family: 'Chakra Petch', sans-serif !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      text-transform: uppercase !important;
    }

    html.theme-cyberpunk .mural-col-count {
      border-radius: 2px !important;
      font-family: 'JetBrains Mono', monospace !important;
      background: var(--line) !important;
      border: 1px solid var(--line-hi) !important;
    }

    html.theme-cyberpunk .mural-card {
      border-radius: 2px !important;
      border: 1px solid var(--line) !important;
      background: var(--bg-card) !important;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)) !important;
      border-top: none !important;
      padding-left: 14px !important;
      position: relative;
    }
    html.theme-cyberpunk .mural-card::before {
      content: "";
      position: absolute; top: 8px; bottom: 8px; left: 0; width: 2.5px;
      background: var(--note-border);
      box-shadow: 0 0 8px var(--note-border), 0 0 14px var(--note-border);
    }
    html.theme-cyberpunk .mural-card:hover {
      border-color: var(--line-hi) !important;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.08) !important;
      transform: translateY(-2px);
    }

    html.theme-cyberpunk .mural-card-has-valor {
      background: linear-gradient(180deg, rgba(255, 194, 74, 0.08) 0%, transparent 100%), var(--bg-card) !important;
      border: 1px solid var(--gold) !important;
      box-shadow: 0 0 12px rgba(255, 194, 74, 0.12) !important;
    }
    html.theme-cyberpunk .mural-card-has-valor:hover {
      box-shadow: 0 0 18px rgba(255, 194, 74, 0.2) !important;
    }

    html.theme-cyberpunk .mural-card-title {
      font-family: 'Chakra Petch', sans-serif !important;
      font-weight: 600 !important;
      color: var(--ink) !important;
      letter-spacing: 0.01em !important;
    }

    html.theme-cyberpunk .mural-badge {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 8.5px !important;
      border-radius: 2px !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      padding: 1px 6px !important;
    }
    html.theme-cyberpunk .badge-prioridade-baixa { border: 1px solid var(--blue) !important; background: rgba(77, 158, 255, 0.08) !important; color: var(--blue) !important; }
    html.theme-cyberpunk .badge-prioridade-media { border: 1px solid var(--gold) !important; background: rgba(255, 194, 74, 0.08) !important; color: var(--gold) !important; }
    html.theme-cyberpunk .badge-prioridade-alta { border: 1px solid var(--orange) !important; background: rgba(255, 138, 61, 0.08) !important; color: var(--orange) !important; }
    html.theme-cyberpunk .badge-prioridade-urgente { border: 1px solid var(--red) !important; background: rgba(255, 45, 79, 0.08) !important; color: var(--red) !important; font-weight: 700 !important; animation: pulsePri 1.8s ease-in-out infinite !important; }

    html.theme-cyberpunk .mural-valor-badge {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 9px !important;
      border-radius: 2px !important;
      border: 1px solid var(--gold) !important;
      background: rgba(255, 194, 74, 0.06) !important;
      color: var(--gold) !important;
      text-shadow: 0 0 6px rgba(255, 194, 74, 0.4) !important;
    }

    html.theme-cyberpunk .mural-card-footer {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 9px !important;
    }
    html.theme-cyberpunk .mural-card-author {
      color: var(--accent) !important;
    }

    html.theme-cyberpunk .mural-btn-primary {
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05)) !important;
      border: 1px solid var(--accent) !important;
      color: var(--accent) !important;
      border-radius: 2px !important;
      font-family: 'JetBrains Mono', monospace !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.15), inset 0 0 8px rgba(0, 240, 255, 0.08) !important;
    }
    html.theme-cyberpunk .mural-btn-primary:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 12px rgba(0, 240, 255, 0.15) !important;
      transform: translateY(-1.5px);
    }
    html.theme-cyberpunk .mural-btn-ghost {
      background: transparent !important;
      border: 1px solid var(--line-hi) !important;
      color: var(--ink-2) !important;
      border-radius: 2px !important;
      font-family: 'JetBrains Mono', monospace !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
    }
    html.theme-cyberpunk .mural-btn-ghost:hover {
      border-color: var(--accent) !important;
      color: var(--accent) !important;
      transform: translateY(-1.5px);
    }

    html.theme-cyberpunk .mural-modal {
      background: var(--bg-panel) !important;
      border: 1px solid var(--line) !important;
      border-radius: 4px !important;
      box-shadow: 0 0 32px rgba(0, 240, 255, 0.12) !important;
    }
    html.theme-cyberpunk .mural-search-input {
      background: var(--bg-card) !important;
      border: 1px solid var(--line) !important;
      border-radius: 2px !important;
      color: var(--ink) !important;
    }
    html.theme-cyberpunk .mural-search-input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15) !important;
    }
    html.theme-cyberpunk .mural-select {
      background: var(--bg-card) !important;
      border: 1px solid var(--line) !important;
      border-radius: 2px !important;
      color: var(--ink) !important;
    }
    html.theme-cyberpunk .mural-select:focus {
      border-color: var(--accent) !important;
    }

    html.theme-cyberpunk .mural-user-chip {
      background: var(--bg-panel) !important;
      border: 1px solid var(--line) !important;
      border-radius: 4px !important;
    }
    html.theme-cyberpunk .mural-user-avatar {
      border-radius: 2px !important;
      background: rgba(0, 240, 255, 0.1) !important;
      border: 1px solid var(--accent) !important;
      color: var(--accent) !important;
      font-family: 'JetBrains Mono', monospace !important;
    }

    html.theme-cyberpunk #mural-toast-container > div {
      background: var(--bg-panel) !important;
      border: 1px solid var(--line) !important;
      border-left: 4px solid var(--accent) !important;
      border-radius: 2px !important;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15) !important;
    }

    html.theme-cyberpunk .mural-card-assignee-avatar {
      border-radius: 2px !important;
      background: rgba(0, 240, 255, 0.1) !important;
      border: 1px solid var(--accent) !important;
      color: var(--accent) !important;
      font-family: 'JetBrains Mono', monospace !important;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15) !important;
    }

    @keyframes pulsePri {
      0%, 100% { box-shadow: 0 0 4px var(--red), inset 0 0 4px var(--red); }
      50%      { box-shadow: 0 0 10px var(--red), inset 0 0 8px var(--red); }
    }
  </style>
</head>
<body>
  <div class="glow-blob a"></div>
  <div class="glow-blob b"></div>
  <div class="mural-page">
    <div class="mural-wrap">
      <!-- HERO HEADER -->
      <div class="mural-hero">
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
          <div class="mural-hero-text">
            <h2 style="font-family: 'Outfit', sans-serif; font-size: clamp(20px, 3.5vw, 28px); font-weight: 800; background: linear-gradient(120deg, #d4af37, #fef1c9, #b99326, #fef1c9, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; filter: drop-shadow(0 2px 12px rgba(212, 175, 55, 0.35)); letter-spacing: -0.02em; user-select: none; text-transform: uppercase; animation: shine-animation 4s linear infinite;">
              O Senhor é meu pastor e nada me faltará
            </h2>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <div class="mural-user-chip" id="user-chip" style="display:none;">
            <div class="mural-user-avatar" id="user-avatar">?</div>
            <div class="mural-user-info">
              <span class="mural-user-nome" id="user-nome-display">—</span>
              <span class="mural-user-nivel" id="user-nivel-display">—</span>
            </div>
          </div>
          <button class="mural-btn-sair" id="btn-sair" style="display:none;">⏻ Sair</button>
          <button class="mural-btn mural-btn-primary" id="btn-novo-recado">➕ Criar Recado</button>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="mural-toolbar" style="justify-content:flex-end;">
        <div id="mural-assignee-filters" style="display: flex; gap: 8px; align-items: center; margin-right: auto; overflow-x: auto; padding: 2px 0;"></div>
        <select id="mural-theme-select" class="mural-select" style="min-height: 42px; margin-right: 8px;">
          <optgroup label="Interface Glassmorphism">
            <option value="light">☀️ Claro</option>
            <option value="dark">🌙 Escuro</option>
            <option value="vintage">🍂 Vintage</option>
            <option value="cosmos">🌌 Cosmos</option>
            <option value="esmeralda">💚 Esmeralda</option>
            <option value="diamante">💎 Diamante</option>
            <option value="safira">💙 Safira</option>
            <option value="vulcano">🌋 Vulcano</option>
            <option value="crepusculo">🌅 Crepúsculo</option>
            <option value="nordico">❄️ Nórdico</option>
            <option value="cacau">☕ Cacau</option>
            <option value="ametista">🔮 Ametista</option>
          </optgroup>
          <optgroup label="Interface Avançada">
            <option value="cyberpunk">⚡ Cyberpunk (Neon)</option>
          </optgroup>
        </select>
        <button class="mural-btn mural-btn-ghost" id="btn-atualizar" title="Atualizar mural">↺ Atualizar</button>
      </div>

      <!-- Column Layout -->
      <div class="mural-columns">
        <!-- A FAZER -->
        <div class="mural-col mural-col-todo" id="col-a_fazer" data-status="a_fazer">
          <div class="mural-col-head">
            <div class="mural-col-title">📌 A Fazer</div>
            <span class="mural-col-count" id="count-a_fazer">0</span>
          </div>
          <div class="mural-col-list" id="list-a_fazer"></div>
        </div>

        <!-- EM ANDAMENTO -->
        <div class="mural-col mural-col-progress" id="col-em_andamento" data-status="em_andamento">
          <div class="mural-col-head">
            <div class="mural-col-title">⚡ Em Progresso</div>
            <span class="mural-col-count" id="count-em_andamento">0</span>
          </div>
          <div class="mural-col-list" id="list-em_andamento"></div>
        </div>

        <!-- CONCLUIDO -->
        <div class="mural-col mural-col-done" id="col-concluido" data-status="concluido">
          <div class="mural-col-head">
            <div class="mural-col-title">✅ Concluído</div>
            <span class="mural-col-count" id="count-concluido">0</span>
          </div>
          <div class="mural-col-list" id="list-concluido"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Creation & Edit Modal -->
  <div class="mural-modal-backdrop" id="modal-backdrop">
    <div class="mural-modal">
      <div class="mural-modal-header">
        <h3 id="modal-title">Novo Recado no Mural</h3>
        <button class="mural-modal-close" id="btn-fechar-modal">&times;</button>
      </div>
      <form id="mural-form" style="display:flex; flex-direction:column; gap:16px;">
        <input type="hidden" id="form-id" />
        
        <div class="mural-form-group">
          <label class="mural-label" for="form-titulo">Título *</label>
          <input type="text" id="form-titulo" class="mural-search-input" style="width:100%; box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:10px 14px;" placeholder="O que precisa ser feito ou comunicado?" required />
        </div>

        <div class="mural-form-group">
          <label class="mural-label" for="form-conteudo">Mensagem / Conteúdo *</label>
          <textarea id="form-conteudo" class="mural-search-input" style="width:100%; min-height:90px; resize:vertical; box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:10px 14px;" placeholder="Explicação ou detalhes do recado..." required></textarea>
        </div>

        <div class="mural-form-group">
            <label class="mural-label" for="form-prioridade">Prioridade</label>
            <select id="form-prioridade" class="mural-select" style="box-shadow:var(--neo-in-sm); min-height:42px;">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente 🔥</option>
            </select>
        </div>

        <!-- Autor preenchido automaticamente pelo usuário logado -->
        <input type="hidden" id="form-autor" />
        <div class="mural-form-group">
          <label class="mural-label" for="form-destinatario">Destinatário</label>
          <select id="form-destinatario" class="mural-select" style="width:100%; box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:10px 14px; min-height:42px;">
            <option value="Todos">Todos</option>
          </select>
        </div>

        <!-- Cor e urgência integradas automaticamente -->

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="mural-form-group">
            <label class="mural-label" for="form-valor">Valor R$ (Opcional)</label>
            <input type="text" id="form-valor" class="mural-search-input" style="width:100%; box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:10px 14px;" placeholder="Ex: 1.500,00" />
          </div>
          <div class="mural-form-group">
            <label class="mural-label" for="form-file">Anexar Arquivo (Opcional)</label>
            <input type="file" id="form-file" class="mural-search-input" style="width:100%; box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:10px 14px;" />
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button type="button" class="mural-btn mural-btn-ghost" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="mural-btn mural-btn-primary" id="btn-salvar">Salvar no Mural</button>
        </div>
      </form>
      
      <!-- Comments Section -->
      <div id="mural-comments-section" style="display:none; border-top: 1px solid var(--border); padding-top:16px; margin-top:8px;">
        <h4 style="margin:0 0 10px; font-size:13px; font-weight:800; color:var(--text);">💬 Comentários</h4>
        <div id="mural-comments-list" style="max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding-right:4px;">
          <!-- Comentários injetados dinamicamente -->
        </div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="mural-comment-input" class="mural-search-input" placeholder="Escreva um comentário..." style="box-shadow:var(--neo-in-sm); background:var(--bg); border: 1px solid var(--border); border-radius:12px; padding:8px 12px; font-size:12px; flex:1;" />
          <button type="button" id="btn-mural-send-comment" class="mural-btn mural-btn-primary" style="min-height:36px; height:36px; padding:0 14px; font-size:12px; border-radius:12px;">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="mural-hidden-file-input" style="display:none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.zip,.rar,.jpg,.jpeg,.png,.gif,.svg,.mp4,.mp3" />

  <script>
    'use strict';

    let cacheRecados = [];

        document.body.appendChild(container);
      }
      const colors = { error: '#e11d48', success: '#16a34a', info: '#1e40af', warn: '#d97706' };
      const toast = document.createElement('div');
      toast.style.cssText = `background:${colors[type]||colors.info};color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;max-width:360px;`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {

        setTimeout(() => toast.remove(), 300);

    const EMPTY_STATES = {

    function renderSkeletons() {
      ['a_fazer', 'em_andamento', 'concluido'].forEach(col => {
        const list = document.querySelector(`#col-${col} .mural-col-list`);
        if (!list) return;
        list.innerHTML = [1, 2, 3].map((_, i) => `
          <div class="mural-skeleton-card" style="animation-delay:${i * 80}ms">
            <div class="mural-skeleton-line" style="width:${60 + i * 10}%;height:14px;"></div>
            <div class="mural-skeleton-line" style="width:85%;height:10px;"></div>
            <div class="mural-skeleton-line" style="width:${50 + i * 8}%;height:10px;"></div>
            <div class="mural-skeleton-line" style="width:40%;height:9px;margin-top:4px;"></div>
          </div>
        `).join('');
      });

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    function loadSessionAuthor() {
      const userNome = sessionStorage.getItem('user_nome');
      if (userNome) {
        document.getElementById('form-autor').value = userNome;

    function populateUserChip() {

      if (!nome) return;

      const chip = document.getElementById('user-chip');

      const avatar = document.getElementById('user-avatar');
      const nomeEl = document.getElementById('user-nome-display');

      // Primeira letra do nome como avatar
      avatar.textContent = nome.charAt(0).toUpperCase();

    let filtroResponsavel = 'Todos';

    function renderAssigneeFilters(users) {
      const container = document.getElementById('mural-assignee-filters');
      if (!container) return;

      const uniqueNames = ['Todos', ...users.filter(u => u.ativo).map(u => u.nome)];
      
      container.innerHTML = uniqueNames.map(name => {
        const isAll = name === 'Todos';
        const initial = isAll ? '👥' : name.charAt(0).toUpperCase();
        const activeClass = (filtroResponsavel === name) ? 'active' : '';
        
        let bg = 'linear-gradient(135deg, var(--blue), var(--purple))';
        if (!isAll) {
          const colors = {
            'A': '#3b6db8', 'B': '#4a8a5a', 'C': '#cb6a2a', 'D': '#8a5a8c',
            'E': '#7a6d4a', 'F': '#3b6db8', 'G': '#4a8a5a', 'H': '#cb6a2a',
            'I': '#8a5a8c', 'J': '#4d6b8a', 'K': '#7a6d4a', 'L': '#3b6db8',
            'M': '#8a5a8c', 'N': '#4a8a5a', 'O': '#cb6a2a', 'P': '#7a6d4a',
            'Q': '#3b6db8', 'R': '#7a6d4a', 'S': '#8a5a8c', 'T': '#4a8a5a',
            'U': '#cb6a2a', 'V': '#7a6d4a', 'W': '#3b6db8', 'X': '#8a5a8c',

    window.setFiltroResponsavel = function(name) {
      filtroResponsavel = name;
      document.querySelectorAll('.mural-filter-chip').forEach(chip => {

          chip.classList.add('active');

          chip.classList.remove('active');

    async function loadDestinatarios() {
      try {
        const res = await fetch('/api/auth/usuarios');
        if (res.ok) {
          const users = await res.json();
          const select = document.getElementById('form-destinatario');
          if (select) {

            users.forEach(u => {

    document.addEventListener('DOMContentLoaded', function() {
      populateUserChip();
      loadDestinatarios();

      // Inicializa e controla o seletor de tema do mural
      const themeSelect = document.getElementById('mural-theme-select');
      if (themeSelect) {
        const mt = localStorage.getItem('mural_theme') || 'default';
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        if (mt === 'cyberpunk') {
          themeSelect.value = 'cyberpunk';
          document.documentElement.classList.add('theme-cyberpunk');
        } else {
          themeSelect.value = currentTheme;
          document.documentElement.classList.remove('theme-cyberpunk');
        }
        
        themeSelect.addEventListener('change', function() {
          const selected = themeSelect.value;
          if (selected === 'cyberpunk') {
            localStorage.setItem('mural_theme', 'cyberpunk');
            document.documentElement.classList.add('theme-cyberpunk');
          } else {
            localStorage.setItem('mural_theme', 'default');
            localStorage.setItem('theme', selected);
            document.documentElement.setAttribute('data-theme', selected);
            document.documentElement.classList.remove('theme-cyberpunk');
            
            // Sincroniza a classe ativa dos botões do cabeçalho compartilhado (se houver)
            document.querySelectorAll('.theme-select-btn').forEach(btn => {

            });

        // Sincroniza o seletor local do mural quando o tema é alterado pelo cabeçalho (dropdown de perfil)
        document.addEventListener('click', function(e) {
          const btn = e.target.closest('.theme-select-btn');
          if (btn) {
            const val = btn.getAttribute('data-theme-val');
            localStorage.setItem('mural_theme', 'default');
            document.documentElement.classList.remove('theme-cyberpunk');

    let seenRecadosIds = new Set();

    function playNotificationSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        // Ding
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        gain1.gain.setValueAtTime(0.12, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.4);
        
        // Dong
        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.00, ctx.currentTime); // A5
          gain2.gain.setValueAtTime(0.12, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.6);
        }, 120);
      } catch (e) {
        console.error("Erro ao reproduzir som de notificação:", e);
      }
    }
