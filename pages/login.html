<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistema de Empenhos</title>
  <link rel="icon" type="image/png" href="/static/img/brasao.png" />
  <link rel="stylesheet" href="/static/css/index.css" />
  <style>
    /* ===== LOGIN PAGE SPECIFIC ===== */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0c14 0%, #111322 50%, #0d0f1a 100%);
      position: relative;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Animated background dots */
    .login-dots-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.4;
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: rgba(13, 15, 26, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      animation: loginFadeIn 0.6s ease-out;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo area */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.3));
      animation: loginLogoFloat 3s ease-in-out infinite;
    }

    @keyframes loginLogoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #e2e8f0;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }

    .login-logo p {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }

    /* Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .login-field label span {
      color: #3b82f6;
    }

    .login-input-wrapper {
      position: relative;
    }

    .login-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: rgba(19, 21, 31, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.25s ease;
      outline: none;
      box-sizing: border-box;
    }

    .login-input::placeholder {
      color: #475569;
    }

    .login-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: rgba(19, 21, 31, 1);
    }

    .login-input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .login-toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .login-toggle-password:hover {
      color: #94a3b8;
    }

    .login-toggle-password svg {
      width: 18px;
      height: 18px;
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .login-divider span {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Button */
    .login-btn {
      position: relative;
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .login-btn:hover::after {
      transform: translateX(100%);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }

    .login-btn:hover svg {
      transform: translateX(3px);
    }

    /* Spinner */
    .login-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: loginSpin 0.8s linear infinite;
    }

    @keyframes loginSpin {
      to { transform: rotate(360deg); }
    }

    /* Error message */
    .login-error {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      color: #f87171;
      font-size: 13px;
      animation: loginShake 0.4s ease;
    }

    .login-error svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    @keyframes loginShake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }

    .login-footer a {
      color: #3b82f6;
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-footer a:hover {
      color: #60a5fa;
    }

    /* Floating particles */
    .login-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: loginParticleFloat linear infinite;
    }

    @keyframes loginParticleFloat {
      0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        margin: 20px;
        padding: 36px 24px;
        border-radius: 16px;
      }

      .login-logo-img {
        width: 52px;
        height: 52px;
      }

      .login-logo h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="login-page">
  <!-- Animated background canvas -->
  <canvas id="login-canvas" class="login-dots-canvas"></canvas>

  <!-- Floating particles (generated by JS) -->
  <div id="login-particles"></div>

  <!-- Login card -->
  <div class="login-card">
    <div class="login-logo">
      <img src="/static/img/brasao.png" alt="Brasão" class="login-logo-img" />
      <h1>Sistema de Empenhos</h1>
      <p>Prefeitura Municipal de Inajá</p>
    </div>

    <form class="login-form" id="login-form" onsubmit="return false;">
      <div class="login-field">
        <label for="login-usuario">Usuário <span>*</span></label>
        <div class="login-input-wrapper">
          <input
            type="text"
            id="login-usuario"
            class="login-input"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="login-field">
        <label for="login-senha">Senha <span>*</span></label>
        <div class="login-input-wrapper">
          <input
            type="password"
            id="login-senha"
            class="login-input"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
          <button type="button" class="login-toggle-password" id="toggle-password" title="Mostrar senha">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <div class="login-error" id="login-error" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="login-error-text">Senha incorreta</span>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        <span id="login-btn-text">Entrar</span>
        <svg id="login-btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
        <div id="login-btn-spinner" class="login-spinner" style="display:none;"></div>
      </button>
    </form>

    <div class="login-footer">
      <p>Área restrita — <a href="/">Voltar ao início</a></p>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
